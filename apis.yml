aid: gourmey
name: Gourmey
description: 'Gourmey is a Paris-based cultivated meat company producing sustainable,
  cell-cultured meat delights — starting with cultivated foie gras — for an uncompromising
  and conscious generation. Founded in France and backed by Partech and Point Nine,
  Gourmey grows real meat directly from animal cells without raising or slaughtering
  animals, aiming for a lower environmental footprint across the food and agritech
  sectors. It was added to the API Evangelist network as a venture-portfolio company
  profile; Gourmey operates a consumer and corporate website but does not publish a
  public developer API, documentation, or SDK surface at this time.'
